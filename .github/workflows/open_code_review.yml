name: Open Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Event triggers must live in the consuming repository. All command handling,
# authorization, model selection, concurrency, and review behavior is shared.
jobs:
  review:
    uses: iftech/common-open-code-review/.github/workflows/open_code_review.yml@main
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

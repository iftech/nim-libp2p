name: Interoperability Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIMBLE_COMMIT: aa8e6ea09ecac774b6fad42552569ce07bef37ec # v0.24.1

permissions:
  contents: read

# build all peers before running them, so that no peer times out while it waits for another peer to build.
jobs:
  run-transport-interop:
    name: Run transport interoperability tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        run: docker build --load -t nim-libp2p-transport-head -f interop/transport/Dockerfile .
      - name: Run tests
        uses: libp2p/test-plans/.github/actions/run-transport-interop-test@master
        with:
          test-filter: nim-libp2p-transport-head
          # without suffix action fails because "hole-punching-interop" artifacts have
          # the same name as "transport-interop" artifacts
          test-results-suffix: transport-interop
          extra-versions: ${{ github.workspace }}/interop/transport/version.json
          worker-count: 4
          known-errors: "^(c-v0\\.0\\.1 x nim-libp2p-transport-head \\(quic-v1\\)|eth-p2p-z-v0\\.0\\.1 x nim-libp2p-transport-head \\(quic-v1\\))$"

  run-hole-punching-interop:
    name: Run hole punching interoperability tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        run: docker build --load -t nim-libp2p-hp-head -f interop/hole-punching/Dockerfile .
      - name: Run tests
        uses: libp2p/test-plans/.github/actions/run-interop-hole-punch-test@master
        with:
          test-filter: nim-libp2p-hp-head
          # js cells are known to fail upstream; see libp2p/test-plans#864.
          test-ignore: js-v3.x
          extra-versions: ${{ github.workspace }}/interop/hole-punching/version.json
          s3-cache-bucket: ${{ vars.S3_LIBP2P_BUILD_CACHE_BUCKET_NAME }}
          s3-access-key-id: ${{ vars.S3_LIBP2P_BUILD_CACHE_AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_LIBP2P_BUILD_CACHE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_LIBP2P_BUILD_CACHE_AWS_REGION }}

  run-autonatv2-interop:
    name: Run AutoNATv2 interoperability tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: interop/autonatv2/go-peer/go.sum

      - name: Set up Nim
        uses: "./.github/actions/install_nim"
        with:
          os: linux
          cpu: amd64
          shell: bash
          nim_ref: v2.2.10

      - name: Build the Go peer
        working-directory: interop/autonatv2/go-peer
        run: go build -mod=readonly -o testautonatv2 .

      - name: Build the Nim peer
        run: |
          NIM_VERSION=$(nim --version | sed -n 's/^Nim Compiler Version \([^ ]*\).*/\1/p')
          nimble --noLockfile --requires:"nim == $NIM_VERSION" --resolver:minver -l setup -y
          nim c -d:chronicles_log_level=DEBUG interop/autonatv2/nim-peer/src/nim_peer.nim

      - name: Run Go and Nim together
        run: |
          cd interop/autonatv2/go-peer
          ./testautonatv2 &
          cd ../nim-peer
          ./src/nim_peer "$(cat ../go-peer/peer.id)"

  run-kad-interop:
    name: Run Kademlia DHT interoperability tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Nim
        uses: "./.github/actions/install_nim"
        with:
          os: linux
          cpu: amd64
          shell: bash
          nim_ref: v2.2.10

      - name: Build the Rust peer
        working-directory: interop/kad/rust-peer
        run: cargo build

      - name: Build the Nim peer
        run: |
          NIM_VERSION=$(nim --version | sed -n 's/^Nim Compiler Version \([^ ]*\).*/\1/p')
          nimble --noLockfile --requires:"nim == $NIM_VERSION" --resolver:minver -l setup -y
          nim c -d:chronicles_log_level=DEBUG interop/kad/nim-peer/src/nim_peer.nim

      - name: Run Rust and Nim together
        run: |
          cd interop/kad/rust-peer
          ./target/debug/rust-peer &
          cd ../nim-peer
          ./src/nim_peer

  run-partial-message-interop:
    name: Run Partial Message interoperability tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Nim
        uses: "./.github/actions/install_nim"
        with:
          os: linux
          cpu: amd64
          shell: bash
          nim_ref: v2.2.10

      - name: Build the Go peer
        working-directory: interop/partial-message/go-peer
        run: go build -o peer ./peer.go

      - name: Build the Nim peer
        run: |
          NIM_VERSION=$(nim --version | sed -n 's/^Nim Compiler Version \([^ ]*\).*/\1/p')
          nimble --noLockfile --requires:"nim == $NIM_VERSION" --resolver:minver -l setup -y
          nim c -d:chronicles_log_level=DEBUG interop/partial-message/nim-peer/src/peer.nim

      # the go peer runs in the background because the interop test logic is implemented in the nim peer.
      - name: Run Go and Nim together
        working-directory: interop/partial-message
        run: |
          ./go-peer/peer &
          ./nim-peer/src/peer

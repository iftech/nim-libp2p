name: Linters

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  nph:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # In PR, has extra merge commit: ^1 = PR, ^2 = base
          persist-credentials: false

      - name: Check NPH formatting
        uses: arnetheduck/nph-action@v1
        with:
          version: 0.7.0
          options: "./. *.nim*"
          fail: true
          suggest: true

      - name: Check clang-format (C/H files in cbind/)
        run: |
          find cbind/ \( -name "*.c" -o -name "*.h" \) -print0 | \
            xargs -0 clang-format --dry-run --Werror --style=file:cbind/.clang-format
          echo "All C/H files in cbind/ are properly formatted."

      - name: Check cbind dependency pins
        run: ./tools/check-cbind-pin.sh

      - name: Check Nimble lock versions
        run: python3 tools/check-nimble-lock.py

      - name: Run nim-lint checks
        # `chronicles_linter` imports lint/types, which was moved in nim-lint
        # after this revision. Keep the action pinned until it uses the public API.
        uses: iftech/nim-lint@6fc8fb2c0bf59d7a0c2d5459f6ec119ec4fd3cbe
        with:
          config: linter.nim

      - name: Check License Header
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          config: .github/.licenserc.yaml

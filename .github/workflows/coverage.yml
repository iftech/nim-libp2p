name: Coverage

on:
  # On push to common branches, this computes the coverage that PRs will use for diff
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codecov:
    name: Run coverage and upload to codecov
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NIMBLE_COMMIT: aa8e6ea09ecac774b6fad42552569ce07bef37ec # v0.24.1
      CICOV: YES
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nim
        uses: "./.github/actions/install_nim"
        with:
          os: linux-gcc-14
          cpu: amd64
          shell: bash
          nim_ref: v2.2.10

      - name: Use gcc 14
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Restore dependencies from cache
        uses: "./.github/actions/install_test_deps"
        with:
          os: linux-gcc-14
          cpu: amd64
          cc: gcc
          nim_ref: v2.2.10

      - name: Setup deps
        run: make setup

      - name: Setup coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov build-essential git curl
          mkdir coverage

      - name: Build test_all
        run: |
          NIMFLAGS="--nimcache:nimcache/test_all --lineDir:on --passC:-fprofile-arcs --passC:-ftest-coverage --passL:-fprofile-arcs --passL:-ftest-coverage --threads:on --skipUserCfg"
          NIMFLAGS="$NIMFLAGS -d:chronicles_log_level=INFO -d:libp2p_testing_slow"
          nim c $NIMFLAGS ./tests/test_all

      - name: Run tests
        run: |
          ./tests/test_all

      # Nim attributes generated C code to non-code lines and to lines past the end of the file.
      - name: Run coverage
        run: |
          lcov --capture --directory nimcache --gcov-tool gcov-14 --ignore-errors mismatch \
            --include "${PWD}/libp2p/*" --output-file coverage/coverage.info
          lcov --extract coverage/coverage.info "${PWD}/libp2p/*" --output-file coverage/coverage.f.info \
            --rc c_file_extensions=nim --filter range,blank \
            --omit-lines '^\s*#' \
            --omit-lines '^\s*(proc|func|method|iterator|template)\b([^=]*|.*=\s*(#.*)?)$' \
            --omit-lines '^\s*[\)\]\}]+\s*$'

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.f.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
